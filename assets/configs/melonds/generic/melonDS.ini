; melonDS — generic Android baseline
; Target: melonDS/melonDS.ini
; DS/DSi BIOS and firmware files must be provided separately.

[General]
DirectBoot = 1
DSiFullBIOSBoot = 0

[Screen]
; 0 = natural (top/bottom), 1 = vertical flip, 2 = horizontal
Layout = 0
; 0 = even split, 1 = emphasise top, 2 = emphasise bottom
Sizing = 0
Separation = 0
; 0 = 0°, 1 = 90°, 2 = 180°, 3 = 270°
Rotation = 0
Filter = 0

[3D]
; 0 = software, 1 = hardware (OpenGL)
Renderer = 1
GL_ScaleFactor = 2
GL_BetterPolygons = 0
GL_HiresCoordinates = 0

[Audio]
; 0 = none, 1 = linear, 2 = cosine, 3 = cubic
AudioInterp = 1
; 0 = auto, 1 = 10-bit, 2 = 16-bit
AudioBitDepth = 0
Volume = 256
