# DuckStation — generic Android baseline
# Target: duckstation/settings.ini
# BIOS files must be placed in duckstation/bios/ manually.

[Main]
SettingsVersion = 3
EmulationSpeed = 1.000000
FastForwardSpeed = 0.000000
TurboSpeed = 0.000000
SyncToHostRefreshRate = False
IncreaseTimerResolution = True
RunaheadFrameCount = 0

[CPU]
ExecutionMode = Recompiler
OverclockEnable = False
OverclockNumerator = 1
OverclockDenominator = 1

[GPU]
Renderer = Vulkan
ResolutionScale = 2
Multisampling = 0
UseDebugDevice = False
PerSampleShading = False
TrueColor = True
ScaledDithering = True
TextureFiltering = Bilinear
DisableInterlacing = True
ForceNTSCTimings = False
WidescreenHack = False
PGXPEnable = True
PGXPCulling = True
PGXPTextureCorrection = True
PGXPVertexCache = False
PGXPCPUMode = False

[Display]
AspectRatio = Auto4_3
ActiveStartOffset = 0
ActiveEndOffset = 0

[Audio]
Backend = AAudio
Stretch = TimeStretch
StretchSequenceLengthMS = 30
StretchSeekWindowMS = 5
StretchOverlapMS = 10

[MemoryCards]
Card1Type = PerGameTitle
Card2Type = None
