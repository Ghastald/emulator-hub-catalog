# RetroArch — Ayn Thor / Odin handheld profile
# Vulkan renderer, AMOLED-optimised shader, low-latency settings.
# Tested on Ayn Thor 2 (Dimensity 1200). Adjust savefile/savestate
# paths to match your SD card mount point if using external storage.

video_driver = "vulkan"
video_fullscreen = "true"
video_threaded = "false"
video_vsync = "true"
video_max_swapchain_images = "3"
video_scale_integer = "false"
video_aspect_ratio_auto = "true"

# CRT-aperture gives punchy contrast on AMOLED without over-blooming.
video_shader_enable = "true"
video_shader = "shaders/shaders_slang/crt/crt-aperture.slangp"

# Reduce input latency — Ayn Thor 2 handles this well.
input_poll_type_behavior = "2"
audio_latency = "64"
audio_driver = "audiotrack"

# On-screen notifications
fps_show = "false"
memory_show = "false"

# Menu
menu_driver = "ozone"
ozone_collapse_sidebar = "false"

# Storage — change UUID to match your SD card if using external storage.
# Example: /storage/1234-ABCD/RetroArch/
savefile_directory = "/storage/emulated/0/RetroArch/saves"
savestate_directory = "/storage/emulated/0/RetroArch/states"
screenshot_directory = "/storage/emulated/0/RetroArch/screenshots"

# Controller
input_player1_joypad_index = "0"
input_auto_game_focus = "1"
