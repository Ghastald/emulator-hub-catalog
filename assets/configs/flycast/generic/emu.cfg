# Flycast — generic Android baseline
# Target: flycast/emu.cfg

[config]
backend = vulkan
fullscreen = yes
# 2x internal resolution — reduce to 1 if performance is poor
rend.resolution = 2

# Per-strip alpha sorting; per-triangle is more accurate but slower
alpha.sort = per-strip

# Widescreen hack — enable only for games that support it
screen.widescreen_game_hack = no

# Stick with the first BIOS found in the system directory
bios = ""

[audio]
backend = android
volume = 100

[input]
rumble.enable = yes
