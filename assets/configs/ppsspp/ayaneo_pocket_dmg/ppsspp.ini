; PPSSPP — AYANeo Pocket DMG profile
; 4:3 locked, OLED-friendly brightness, vertical-handheld layout hints.
; Tested on AYANeo Pocket DMG (Snapdragon G3x Gen 2, OLED 4:3 panel).

[General]
Language = Auto
EnableAutoLoad = False
CheckForNewVersion = False
EnableCheats = False

[Graphics]
; Vulkan backend for best performance on Adreno.
GraphicsBackend = 3
; 2x native resolution — keeps sharpness on the 4:3 OLED panel.
InternalResolution = 2
; Lock to 4:3 to match the physical screen.
DisplayAspectRatio = 0
DisplayStretch = False
; No post-processing needed — the OLED is sharp out of the box.
PostShaderName = Off
TextureFiltering = 1
TextureShaderName = Off
ImmersiveMode = True
; Slightly reduced brightness to preserve OLED longevity.
DisplayIntensityFactor = 0.900000
; Accurate depth buffer for fewer graphical glitches.
DepthRasterMode = 0

[Sound]
Enable = True
AudioBackend = 0
SoundSpeedHack = False

[Control]
; Gamepad index 0 — native controller on AYANeo Pocket DMG.
DefaultControlScheme = 1
HapticFeedback = False
; Analogue sticks mapped to PSP analogue.
LeftAnalogUp = 0
LeftAnalogDown = 0

[Network]
EnableWlan = False
