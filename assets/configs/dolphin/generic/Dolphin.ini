# Dolphin core — generic Android baseline
# Target: dolphin-emu/Config/Dolphin.ini

[Core]
CPUCore = 1
Fastmem = True
CPUThread = True
SyncOnSkipIdle = True
SyncGPU = False
DSPHLE = True
TimingVariance = 40
CycleRate = 0
GFXBackend = Vulkan

[DSP]
EnableJIT = True
Backend = AudioTrack

[Display]
FullscreenResolution = Auto
Fullscreen = True
RenderToMain = False

[Interface]
ConfirmStop = False
