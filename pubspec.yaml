name: emulator_hub
description: Retro emulator catalog, store links, and config profile manager.
publish_to: none
version: 0.1.0

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # Networking
  dio: ^5.4.3                        # HTTP client — catalog fetch + GitHub API
  cached_network_image: ^3.3.1       # Emulator icons with disk cache

  # Storage
  shared_preferences: ^2.2.3         # Catalog cache, SAF URI grants, app state
  path_provider: ^2.1.3              # App documents dir for imported profiles

  # Android-specific
  url_launcher: ^6.3.0               # Play Store deep links + GitHub URLs
  file_picker: ^8.0.3                # SAF folder selection for config push
  permission_handler: ^11.3.1        # Storage permissions (Android 12 and below)

  # Root detection
  flutter_jailbreak_detection: ^1.10.0  # Detects root; enables direct-write path

  # UI
  flutter_riverpod: ^2.5.1           # State management
  go_router: ^13.2.0                 # Navigation
  flutter_svg: ^2.0.10+1             # SVG icons
  intl: ^0.19.0                      # Date formatting for changelogs

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.4.9
  riverpod_generator: ^2.4.0

flutter:
  uses-material-design: true
  assets:
    - assets/catalog.json
    - assets/configs/retroarch/generic/retroarch.cfg
    - assets/configs/retroarch/generic/retroarch-core-options.cfg
    - assets/configs/ppsspp/generic/ppsspp.ini
    - assets/icons/
